# Builds the desktop app for macOS (Apple silicon + Intel), Windows and Linux
# when a v* tag is pushed, and attaches the installers to that tag's release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --target aarch64-apple-darwin
          - os: macos-14
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ contains(matrix.os, 'macos') && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/desktop/src-tauri
            packages/shadeans-wasm

      - name: Linux packages Tauri needs
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev libssl-dev libayatana-appindicator3-dev

      - run: npm ci

      # TheDraw fonts ship with Synchronet; only ctrl/tdfonts is fetched
      - name: TheDraw fonts
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/SynchronetBBS/sbbs.git /tmp/sbbs
          git -C /tmp/sbbs sparse-checkout set ctrl/tdfonts
          npm run build -w @killerdraw/core
          node scripts/sync-fonts.mjs /tmp/sbbs/ctrl/tdfonts

      - name: shadeans to WebAssembly
        run: node scripts/build-shadeans.mjs

      # Apple's notary service answered 401 to credentials that work verbatim
      # from a terminal, which leaves the secret's own bytes as the difference:
      # a value pasted into the GitHub UI very often carries a trailing
      # newline, and it is invisible there and masked in the logs. None of
      # these three can legitimately contain whitespace — an email address, a
      # 16-character app-specific password, a team ID — so they are trimmed
      # here rather than trusted to arrive clean. The byte counts say whether
      # it mattered without revealing anything: a count that shrinks is the
      # answer.
      #
      # Writing them to GITHUB_ENV rather than the step's `env:` also keeps
      # them genuinely absent when they are not set. Tauri asks whether
      # APPLE_ID is *present*, and an empty string is present — that mistake
      # cost 0.1.13 its macOS builds.
      - name: Notarization credentials
        if: startsWith(matrix.os, 'macos')
        env:
          RAW_APPLE_ID: ${{ secrets.APPLE_ID }}
          RAW_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          RAW_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          trim() { printf %s "$1" | tr -d '[:space:]'; }
          count() { printf %s "$1" | wc -c | tr -d ' '; }
          id=$(trim "$RAW_APPLE_ID")
          pw=$(trim "$RAW_APPLE_PASSWORD")
          team=$(trim "$RAW_APPLE_TEAM_ID")
          echo "APPLE_ID       $(count "$RAW_APPLE_ID") bytes raw, $(count "$id") trimmed"
          echo "APPLE_PASSWORD $(count "$RAW_APPLE_PASSWORD") bytes raw, $(count "$pw") trimmed"
          echo "APPLE_TEAM_ID  $(count "$RAW_APPLE_TEAM_ID") bytes raw, $(count "$team") trimmed"
          if [ -n "$id" ] && [ -n "$pw" ] && [ -n "$team" ]; then
            { echo "APPLE_ID=$id"; echo "APPLE_PASSWORD=$pw"; echo "APPLE_TEAM_ID=$team"; } >> "$GITHUB_ENV"
            echo "notarization on"
          else
            echo "notarization credentials absent, skipping it"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing. These are the empty string when the secret is not
          # set, and tauri-action skips importing a certificate then — so a
          # fork, or this repo before the secrets existed, still builds
          # unsigned. The Windows and Linux jobs ignore them.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not listed here: the
          # step above puts them in the environment, trimmed, and only when all
          # three are set. Listing them here would define them as empty strings
          # when the secrets are absent, which Tauri reads as present.
          # Signs the updater artifacts (.app.tar.gz, setup.exe, .AppImage); the
          # public half is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          releaseName: jockoshop ${{ github.ref_name }}
          # tells the truth about each state, so the notes cannot outlive the setup
          releaseBody: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && 'macOS builds are signed but not yet notarized, so macOS still warns the first time — right-click the app and choose Open. Windows and Linux builds are unsigned.' || 'Unsigned builds. macOS shows an unidentified developer warning the first time — right-click the app and choose Open.' }}
          prerelease: true
          # latest.json is made once, by the update-feed job below
          includeUpdaterJson: false
          # tauri.release.conf.json turns on the signed updater artifacts; it is
          # left out of local builds, which have no signing key
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  # The feed the app's updater reads: latest.json on the update-feed branch,
  # built from the signed assets once every build job has finished (see
  # scripts/update-feed.mjs for why not includeUpdaterJson). A branch rather than
  # releases/latest because these are pre-releases, which "latest" skips. A
  # platform whose build failed is left out; the others still update.
  update-feed:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/update-feed.mjs "${{ github.ref_name }}" > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"

      - name: Publish to the update-feed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin update-feed >/dev/null; then
            git fetch --depth 1 origin update-feed:refs/remotes/origin/update-feed
            git switch -c update-feed origin/update-feed
          else
            git switch --orphan update-feed
          fi
          cp "$RUNNER_TEMP/latest.json" latest.json
          git add latest.json
          # a re-run of the same release changes nothing
          git diff --cached --quiet || git commit -m "latest.json for ${{ github.ref_name }}"
          git push origin update-feed
