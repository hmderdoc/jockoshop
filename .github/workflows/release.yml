# Builds the desktop app for macOS (Apple silicon + Intel), Windows and Linux
# when a v* tag is pushed, and attaches the installers to that tag's release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --target aarch64-apple-darwin
          - os: macos-14
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ contains(matrix.os, 'macos') && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/desktop/src-tauri
            packages/shadeans-wasm

      - name: Linux packages Tauri needs
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev libssl-dev libayatana-appindicator3-dev

      - run: npm ci

      # TheDraw fonts ship with Synchronet; only ctrl/tdfonts is fetched
      - name: TheDraw fonts
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/SynchronetBBS/sbbs.git /tmp/sbbs
          git -C /tmp/sbbs sparse-checkout set ctrl/tdfonts
          npm run build -w @killerdraw/core
          node scripts/sync-fonts.mjs /tmp/sbbs/ctrl/tdfonts

      - name: shadeans to WebAssembly
        run: node scripts/build-shadeans.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing. These are the empty string when the secret is not
          # set, and tauri-action skips importing a certificate then — so a
          # fork, or this repo before the secrets existed, still builds
          # unsigned. The Windows and Linux jobs ignore them.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization is off until the Apple ID credentials are sorted out:
          # Apple answers 401 to them, and notarizing runs after signing, so a
          # failure there loses the macOS builds entirely rather than leaving
          # them merely unnotarized. Signing above still happens.
          #
          # The three variables are commented out rather than set empty, which
          # was tried and does not work: Tauri tests whether APPLE_ID is
          # *present*, and an empty string is present, so it went on to notarize
          # and then failed with "Team ID must be at least 3 characters".
          # Uncomment all three to turn it back on; the secrets are already set.
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          releaseName: jockoshop ${{ github.ref_name }}
          # tells the truth about each state, so the notes cannot outlive the setup
          releaseBody: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && 'macOS builds are signed but not yet notarized, so macOS still warns the first time — right-click the app and choose Open. Windows and Linux builds are unsigned.' || 'Unsigned builds. macOS shows an unidentified developer warning the first time — right-click the app and choose Open.' }}
          prerelease: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}
